name: Actualizar eventos de GlobalEven

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-events:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Actualizar eventos desde Ticketmaster
        env:
          TICKETMASTER_API_KEY: ${{ secrets.Consumer_Key }}
        run: |
          python scripts/update_events.py

      - name: Comprobar cambios
        id: changes
        run: |
          if git diff --quiet -- data/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar eventos actualizados
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GlobalEven Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Actualizar eventos automáticamente"
          git push

      - name: Sin cambios
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No hubo cambios en los eventos."
